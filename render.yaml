services:
  - type: web
    name: hygiaai-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python start_server.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_PORT
        value: 6333
      - key: QDRANT_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

