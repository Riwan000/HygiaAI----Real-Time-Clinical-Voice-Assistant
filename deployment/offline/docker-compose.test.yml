services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hygiaai-qdrant-test
    ports:
      - "6335:6333"  # REST API (using different port to avoid conflicts)
      - "6336:6334"  # gRPC
    volumes:
      - qdrant_data_test:/qdrant/storage
      - qdrant_config_test:/qdrant/config
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hygiaai-network-test

  # Backend API (FastAPI)
  backend:
    build:
      context: ../..
      dockerfile: deployment/offline/Dockerfile.backend
    container_name: hygiaai-backend-test
    ports:
      - "8001:8000"  # Using different port to avoid conflicts
    volumes:
      - ../../data:/app/data
      - ../../logs:/app/logs
      - backend_cache_test:/app/.cache
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OFFLINE_MODE=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
    env_file:
      - .env.offline
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hygiaai-network-test

  # Frontend (React)
  frontend:
    build:
      context: ../..
      dockerfile: deployment/offline/Dockerfile.frontend
    container_name: hygiaai-frontend-test
    ports:
      - "3001:80"  # Using different port to avoid conflicts
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
      - VITE_ENABLE_OFFLINE_MODE=true
      - VITE_ENABLE_FEDERATED_LEARNING=false
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hygiaai-network-test

volumes:
  qdrant_data_test:
    driver: local
  qdrant_config_test:
    driver: local
  backend_cache_test:
    driver: local

networks:
  hygiaai-network-test:
    driver: bridge

